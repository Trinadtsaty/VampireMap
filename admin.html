<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="color-scheme" content="dark" />
  <title>Админ-панель — Управление локациями</title>

  <link rel="stylesheet" href="leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="loginScreen">
    <div class="login-box">
      <h2>Вход в Админку</h2>
      <div class="field"><input id="loginUser" type="text" placeholder="Логин" value="admin" /></div>
      <div class="field"><input id="loginPass" type="password" placeholder="Пароль" /></div>
      <button id="loginBtn" class="btn btn-primary">Войти</button>
    </div>
  </div>

  <div id="adminPanel" style="display: none;">
    <aside id="sidebar" class="open" style="transform: translateX(0);">
      <div class="sidebar-header">
        <h1>Управление</h1>
        <a href="index.html" class="btn-close" style="text-decoration:none;" title="На карту">↩</a>
      </div>
      <div class="sidebar-content">

        <div class="section-title">Инструменты</div>
        <button id="adminStartDrawLineBtn" class="btn" type="button">✏️ Нарисовать линию</button>

        <div class="sep"></div>

        <div class="section-title">Поиск по адресу</div>
        <div class="field" style="display: flex; gap: 5px;">
          <input id="adminAddressInput" type="text" placeholder="Москва, ул. Тверская, 1" style="flex: 1;" />
          <button id="adminSearchBtn" class="btn" style="width: 44px; padding: 0;">🔍</button>
        </div>

        <div class="sep"></div>

        <div class="section-title">Добавить / Изменить</div>
        <input type="hidden" id="editId" />
        <div class="field"><input id="adminName" type="text" placeholder="Название локации" /></div>
        <div class="field"><input id="adminDesc" type="text" placeholder="Описание (текст)" /></div>
        <div class="field"><input id="adminImg" type="text" placeholder="Ссылка на картинку (Google Диск)" /></div>

        <div class="row">
          <div class="field"><label>Широта</label><input id="adminLat" type="number" step="0.0001" /></div>
          <div class="field"><label>Долгота</label><input id="adminLng" type="number" step="0.0001" /></div>
        </div>

        <div class="row">
          <div class="field" style="flex: 1;">
            <label>Цвет метки</label>
            <select id="adminColor" style="width:100%; padding:9px; border-radius:8px; background:#0c0c11; color:#fff; border:1px solid #2a2a35;">
              <option value="red">Красный</option>
              <option value="blue">Синий</option>
              <option value="green">Зелёный</option>
              <option value="yellow">Жёлтый</option>
              <option value="black">Чёрный</option>
            </select>
          </div>
          <div class="field" style="flex: 1; display: flex; align-items: center; gap: 8px;">
            <input type="checkbox" id="adminVisible" checked style="width: 18px; height: 18px; accent-color: #c01818;" />
            <label for="adminVisible" style="margin: 0; font-size: 13px; color: #fff;">Видна игрокам</label>
          </div>
        </div>

        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
          <button id="adminMoveBtn" class="btn" type="button" style="flex: 1;" title="Включить перетаскивание">✋ Двигать</button>
          <button id="adminMobilePinBtn" class="btn" type="button" style="flex: 1;" title="Режим прицела">🎯 Прицел</button>
        </div>

        <button id="adminSaveBtn" class="btn btn-primary" type="button">Сохранить локацию</button>
        <button id="adminCancelBtn" class="btn" type="button" style="display:none; margin-top: 5px;">Отмена</button>

        <div class="sep"></div>

        <div class="section-title">Импорт / Экспорт</div>
        <div class="row">
          <button id="downloadTemplateBtn" class="btn" type="button">Скачать шаблон</button>
          <button id="importBtn" class="btn" type="button">Загрузить JSON</button>
        </div>
        <input id="importFile" type="file" accept=".json" hidden />

        <div class="sep"></div>

        <div class="section-title">Список локаций</div>
        <div id="adminList" style="max-height: 250px; overflow-y: auto;"></div>
      </div>
    </aside>

    <div id="map" style="margin-left: 320px;"></div>

    <!-- Панель линий -->
    <div id="linesPanel" style="display: none; margin-left: 320px;">
      <h3>Линии на карте</h3>
      <div class="field" style="margin-bottom: 10px;">
        <label>Цвет новой линии</label>
        <select id="lineColorSelect" style="width:100%; padding:5px; border-radius:4px; background:#000; color:#fff; border:1px solid #333;">
          <option value="red">Красный</option>
          <option value="blue">Синий</option>
          <option value="green">Зелёный</option>
        </select>
      </div>
      <div id="linesList"></div>
    </div>
  </div>

  <div id="mobilePinOverlay">
    <div class="crosshair">
      <div class="crosshair-h"></div>
      <div class="crosshair-v"></div>
    </div>
  </div>

  <div id="mobilePinBar">
    <button id="mobilePinConfirm" class="btn btn-primary" style="font-size: 16px; padding: 15px;">Подтвердить локацию</button>
    <button id="mobilePinCancel" class="btn" style="margin-top: 8px;">Отмена</button>
  </div>

  <script src="leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>
